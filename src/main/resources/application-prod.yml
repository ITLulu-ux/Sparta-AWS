spring:
  config:
    import: "aws-parameterstore:/commerce/db/?prefix=spring.datasource."

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  app:
    aws:
      s3:
        bucket: sparta-commerce-profile-2026
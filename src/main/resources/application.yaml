spring:
  application:
    name: Sparta-AWS
  profiles:
    active: local


  cloud:
    aws:
      region:
        static: ap-northeast-2

management:
  endpoints:
    web:
      exposure:
        include: health, info

  info:
    env:
      enabled: true

info:
  team:
    name: Sparta-AWS

app:
  aws:
    s3:
      bucket: sparta-commerce-profile-2026
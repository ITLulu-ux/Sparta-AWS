name: Sparta AWS CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 환경 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle 빌드
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build

      # 4. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. AWS OIDC 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::940592089367:role/github-actions-deploy-role
          aws-region: ap-northeast-2

      # 6. AWS 인증 확인
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 7. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Docker 이미지 빌드 및 Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            luludocker2/sparta-aws:lv4
            luludocker2/sparta-aws:latest

      # 9. EC2 배포 (AWS Systems Manager)
      - name: Deploy to EC2 via SSM
        run: |
          INSTANCE_ID="i-082e2f98e56c1a715"
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Sparta AWS Docker container" \
            --parameters '{"commands":["sudo docker pull luludocker2/sparta-aws:lv4","sudo docker stop sparta-aws-container || true","sudo docker rm sparta-aws-container || true","sudo docker run -d --name sparta-aws-container --restart unless-stopped -p 8080:8080 -e SPRING_PROFILES_ACTIVE=prod luludocker2/sparta-aws:lv4","sudo docker image prune -f","for i in $(seq 1 30); do curl -fsS http://localhost:8080/actuator/health && exit 0; sleep 2; done; exit 1"]}' \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command ID: $COMMAND_ID"
          
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
          
            echo "SSM Status: $STATUS"
          
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi
          
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
          
            sleep 5
          done
          
          echo "SSM deployment timed out"
          exit 1
